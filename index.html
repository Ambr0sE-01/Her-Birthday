<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <!-- Links to your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Clouds -->
    <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>
    </div>

    <!-- Envelope Container -->
    <div class="container">
        <div class="envelope" id="envelope">
            <div class="flap" id="flap"></div>
            <div class="card" id="card">
                <div class="card-content">
                    <!-- REPLACE THE URL HERE WITH HER PICTURE -->
                    <img src="HER.jpeg" alt="Birthday Girl" class="profile-pic">
                    <h2>Happy Birthday!</h2>
                    <p>I'm really glad we started talking. Hope your special day is as amazing as you are!</p>
                </div>
            </div>
            <div class="envelope-front"></div>
        </div>
    </div>

    <!-- Links to your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
